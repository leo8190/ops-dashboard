<article class="panel chart-panel">
  <div class="panel__heading">
    <div>
      <p class="eyebrow">7-day signal</p>
      <h2>Order activity</h2>
    </div>
    <div class="legend" aria-label="Chart legend">
      <span><i class="legend__key legend__key--intake"></i>Intake</span>
      <span><i class="legend__key legend__key--completed"></i>Completed</span>
      <span><i class="legend__key legend__key--cancelled"></i>Cancelled</span>
    </div>
  </div>

  <div
    class="chart"
    role="img"
    aria-label="Grouped bar chart comparing daily order intake, completions, and cancellations"
  >
    <div class="chart__grid" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    @for (point of data(); track point.label) {
      <div class="chart__group" [attr.aria-label]="point.label">
        <div class="chart__bars">
          <span
            class="chart__bar chart__bar--intake"
            [style.height]="height(point.intake)"
            [title]="point.intake + ' intake'"
          ></span>
          <span
            class="chart__bar chart__bar--completed"
            [style.height]="height(point.completed)"
            [title]="point.completed + ' completed'"
          ></span>
          <span
            class="chart__bar chart__bar--cancelled"
            [style.height]="height(point.cancelled)"
            [title]="point.cancelled + ' cancelled'"
          ></span>
        </div>
        <span class="chart__label">{{ point.label }}</span>
      </div>
    }
  </div>
</article>
