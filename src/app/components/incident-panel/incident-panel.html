<article class="panel" id="incidents">
  <div class="panel__heading">
    <div>
      <p class="eyebrow">Needs attention</p>
      <h2>Active incidents</h2>
    </div>
    <span class="count">{{ incidents().length }} live</span>
  </div>

  <div class="incident-list">
    @for (incident of incidents(); track incident.id) {
      <section class="incident" [class.incident--acknowledged]="incident.acknowledged">
        <div class="incident__topline">
          <span [class]="'severity severity--' + incident.severity.toLowerCase()">
            {{ incident.severity }}
          </span>
          <span class="incident__time">{{ incident.elapsed }}</span>
        </div>
        <h3>{{ incident.title }}</h3>
        <p>{{ incident.service }} · {{ incident.owner }}</p>
        @if (incident.acknowledged) {
          <span class="acknowledged">
            <span aria-hidden="true">✓</span>
            Acknowledged
          </span>
        } @else {
          <button
            type="button"
            (click)="acknowledged.emit(incident.id)"
            [attr.aria-label]="'Acknowledge ' + incident.title"
          >
            Acknowledge
          </button>
        }
      </section>
    }
  </div>
</article>
