<article class="metric">
  <div class="metric__heading">
    <p>{{ metric().label }}</p>
    <span class="metric__icon" [class]="'metric__icon metric__icon--' + metric().tone">
      @switch (metric().icon) {
        @case ('throughput') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 17.5 9 12l3.5 3.5L20 7"></path>
            <path d="M15 7h5v5"></path>
          </svg>
        }
        @case ('sla') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="m8.5 12 2.2 2.2 4.8-5"></path>
          </svg>
        }
        @case ('incident') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4 3.8 18h16.4z"></path>
            <path d="M12 9v4m0 2.5v.1"></path>
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
            <path d="M12 8v4.5l3 1.5"></path>
          </svg>
        }
      }
    </span>
  </div>
  <strong class="metric__value">{{ metric().value }}</strong>
  <div class="metric__footer">
    <span [class]="'metric__change metric__change--' + metric().tone">
      @if (metric().direction === 'up') {
        <span aria-hidden="true">↗</span>
      } @else if (metric().direction === 'down') {
        <span aria-hidden="true">↘</span>
      }
      {{ metric().change }}
    </span>
    <span class="metric__context">{{ metric().context }}</span>
  </div>
</article>
